name: CI

# La CI de Kaissi vérifie trois choses, dans cet ordre d'importance :
#   1. les CALCULS MONÉTAIRES de packages/domain sont justes ;
#   2. tout le monorepo compile ;
#   3. le bundle du POS ne dépend d'AUCUNE ressource réseau (mode avion).
#
# Le point 3 mérite un contrôle automatique : « jamais de server.url » est une
# règle d'architecture, et une règle qui n'échoue pas en CI est un commentaire.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  domaine:
    name: Domaine — calculs monétaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests du domaine (monnaie, TVA, remises, réduction d'événements)
        run: pnpm --filter @kaissi/domain test
      - name: Tests du schéma local (migrations, outbox, immuabilité)
        run: pnpm --filter @kaissi/db-local test
      - name: Tests du rendu ESC/POS
        run: pnpm --filter @kaissi/printing test

  types:
    name: Vérification des types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  mode-avion:
    name: Mode avion — le bundle POS ne dépend d'aucun réseau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build du POS (cible Android) + vérification du mode avion
        run: pnpm --filter @kaissi/pos build
      # Archivé AVANT le build web : les deux cibles écrivent dans le même
      # `dist`, et c'est le bundle embarqué dans l'APK qu'on veut pouvoir
      # inspecter après coup.
      - name: Archiver le bundle Android
        uses: actions/upload-artifact@v4
        with:
          name: bundle-pos
          path: apps/pos/dist
          retention-days: 7
      # La cible web sert le MÊME code comme site statique. Elle a sa propre
      # politique de sécurité (WebAssembly) et son propre service worker :
      # la construire ici évite de découvrir une régression au déploiement.
      - name: Build du POS (cible web) + vérification du mode avion
        run: pnpm --filter @kaissi/pos build:web
      - name: Archiver le bundle web
        uses: actions/upload-artifact@v4
        with:
          name: bundle-pos-web
          path: apps/pos/dist
          retention-days: 7

  plugin-natif:
    name: Plugin natif — le code Java d'impression compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Compile ImprimanteReseau.java sans SDK Android, contre des doublures
      # elles-memes verifiees face aux sources reelles de Capacitor.
      # Ce job ne remplace pas un build Gradle : il fait tomber tot les fautes
      # de signature, qui sinon n'apparaissent que sur un poste equipe.
      - name: Verification du plugin natif
        run: pnpm --filter @kaissi/pos verifier:natif

  back-office:
    name: Back-office — types, tests et build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests du back-office
        run: pnpm --filter @kaissi/backoffice test
      # Le build echoue si un lien pointe vers une page inexistante (routes
      # typees) ou si une colonne du schema a ete renommee sans mettre a jour
      # src/serveur/schema.ts. Aucune variable d'environnement n'est requise :
      # toutes les pages sont rendues a la demande, jamais au build.
      - name: Build Next.js
        run: pnpm --filter @kaissi/backoffice build

  parcours-caisse:
    name: Parcours de caisse de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium
        run: pnpm --filter @kaissi/pos exec playwright install --with-deps chromium
      - name: Démarrer le POS et rejouer une journée de service
        run: |
          pnpm --filter @kaissi/pos exec vite --port 5173 --host 127.0.0.1 &
          npx wait-on -t 60000 http://127.0.0.1:5173/
          node apps/pos/tests/parcours-caisse.mjs

  synchronisation:
    name: Synchronisation — contre un vrai PostgreSQL
    runs-on: ubuntu-latest
    # Une base simulée validerait notre idée du SQL, pas le SQL. Or c'est là
    # que se cachent les erreurs de RLS, de contrainte et d'idempotence.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Appliquer le schéma de production tel quel
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1             -f apps/sync/test/amorce-supabase.sql
          for f in supabase/migrations/*.sql; do
            echo "→ $(basename "$f")"
            psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Tests d'intégration + banc à trois appareils
        run: pnpm --filter @kaissi/sync test

  regles-absolues:
    name: Règles absolues (argent, UUID, server.url)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun server.url dans la configuration Capacitor
        run: |
          if grep -nE '^\s*(server\s*:|url\s*:)' apps/pos/capacitor.config.ts; then
            echo '::error::Un bloc server a ete introduit dans capacitor.config.ts. Le POS doit rester EMPAQUETE : charger une URL distante le rend inutilisable hors ligne. Voir CLAUDE.md.' 
            exit 1
          fi
          echo "OK — le POS reste empaqueté."

      - name: Aucune colonne monetaire sans suffixe _millimes
        run: |
          # Toute colonne dont le nom évoque un montant DOIT porter le suffixe.
          fautes=$(grep -rnE '^\s+[a-z_]*(price|amount|total|cost|subtotal|discount|tax|float|variance|counted|expected|duty)[a-z_]*\s+(bigint|integer|numeric)' \
            supabase/migrations/*.sql \
            | grep -v '_millimes' \
            | grep -v '_bp' \
            | grep -v 'cost_per_unit' \
            | grep -v 'numeric(18,6)' || true)
          if [ -n "$fautes" ]; then
            echo "::error::Colonne(s) monétaire(s) sans suffixe _millimes :"
            echo "$fautes"
            exit 1
          fi
          echo "OK — tous les montants sont suffixés _millimes."

      - name: Aucun type flottant pour de l'argent
        run: |
          if grep -rniE '\b(real|double precision|float[48]?)\b' supabase/migrations/*.sql; then
            echo "::error::Un type flottant a été introduit dans le schéma."
            echo "RÈGLE 1 : aucun flottant pour de l'argent, nulle part."
            exit 1
          fi
          echo "OK — aucun flottant dans le schéma."

      - name: Journaux order_events et audit_events en insertion seule
        run: |
          for table in order_events audit_events; do
            if ! grep -q "revoke update, delete, truncate on kaissi.$table" supabase/migrations/*.sql; then
              echo "::error::Le REVOKE sur kaissi.$table a disparu (RÈGLE 6)."
              exit 1
            fi
            if ! grep -q "${table}_immuable" supabase/migrations/*.sql; then
              echo "::error::Le déclencheur d'immuabilité de kaissi.$table a disparu."
              exit 1
            fi
          done
          echo "OK — les deux journaux restent append-only."

      - name: Index unique d'idempotence présent
        run: |
          if ! grep -q 'event_id        uuid        primary key' supabase/migrations/0005_sync.sql; then
            echo "::error::sync_mutations.event_id n'est plus clé primaire (RÈGLE 5)."
            echo "Sans cet index unique, le double encaissement redevient possible."
            exit 1
          fi
          echo "OK — l'idempotence est garantie."

      - name: Aucune cle de service Supabase dans le depot
        run: |
          # La cle service_role CONTOURNE RLS : elle ne doit exister nulle part
          # dans le code, et surtout pas dans le back-office qui tourne sur
          # Vercel. Seule la cle publique y a sa place.
          # Le seul fichier autorise a nommer ces cles est celui qui les REFUSE.
          if grep -rnE 'sb_secret_|service_role_key|SUPABASE_SERVICE_ROLE' \
               --include='*.ts' --include='*.tsx' --include='*.mjs' \
               --include='*.json' apps packages 2>/dev/null \
             | grep -v 'apps/backoffice/src/serveur/supabase.ts'; then
            echo '::error::Une reference a la cle de service Supabase a ete introduite.'
            exit 1
          fi
          echo "OK — aucune cle de service dans le code."

      - name: Aucun PIN en clair dans le code ou la graine
        run: |
          # Un hachage Argon2id est acceptable ; un PIN littéral affecté à
          # `pin_hash` ne l'est jamais.
          fautes=$(grep -rnE "pin_hash.*['\"][0-9]{4,8}['\"]" \
            packages/ apps/ --include='*.ts' --include='*.tsx' || true)
          if [ -n "$fautes" ]; then
            echo "::error::PIN en clair détecté :"
            echo "$fautes"
            exit 1
          fi
          echo "OK — aucun PIN en clair."
