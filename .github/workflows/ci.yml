name: CI

# La CI de Kaissi vérifie trois choses, dans cet ordre d'importance :
#   1. les CALCULS MONÉTAIRES de packages/domain sont justes ;
#   2. tout le monorepo compile ;
#   3. le bundle du POS ne dépend d'AUCUNE ressource réseau (mode avion).
#
# Le point 3 mérite un contrôle automatique : « jamais de server.url » est une
# règle d'architecture, et une règle qui n'échoue pas en CI est un commentaire.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  domaine:
    name: Domaine — calculs monétaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests du domaine (monnaie, TVA, remises, réduction d'événements)
        run: pnpm --filter @kaissi/domain test
      - name: Tests du schéma local (migrations, outbox, immuabilité)
        run: pnpm --filter @kaissi/db-local test
      - name: Tests du rendu ESC/POS
        run: pnpm --filter @kaissi/printing test

  types:
    name: Vérification des types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  mode-avion:
    name: Mode avion — le bundle POS ne dépend d'aucun réseau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build du POS (cible Android) + vérification du mode avion
        run: pnpm --filter @kaissi/pos build
      # Archivé AVANT le build web : les deux cibles écrivent dans le même
      # `dist`, et c'est le bundle embarqué dans l'APK qu'on veut pouvoir
      # inspecter après coup.
      - name: Archiver le bundle Android
        uses: actions/upload-artifact@v4
        with:
          name: bundle-pos
          path: apps/pos/dist
          retention-days: 7
      # La cible web sert le MÊME code comme site statique. Elle a sa propre
      # politique de sécurité (WebAssembly) et son propre service worker :
      # la construire ici évite de découvrir une régression au déploiement.
      - name: Build du POS (cible web) + vérification du mode avion
        run: pnpm --filter @kaissi/pos build:web
      - name: Archiver le bundle web
        uses: actions/upload-artifact@v4
        with:
          name: bundle-pos-web
          path: apps/pos/dist
          retention-days: 7

  plugin-natif:
    name: Plugin natif — le code Java d'impression compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Compile ImprimanteReseau.java sans SDK Android, contre des doublures
      # elles-memes verifiees face aux sources reelles de Capacitor.
      # Ce job ne remplace pas un build Gradle : il fait tomber tot les fautes
      # de signature, qui sinon n'apparaissent que sur un poste equipe.
      - name: Le JDK installé est dans la plage éprouvée
        # Le même contrôle que celui posé devant `pnpm pos:android`, avec un
        # VRAI JDK : si la plage du script cesse de correspondre à celle que
        # la CI utilise, on l'apprend ici et pas sur le poste d'un gérant.
        run: pnpm verifier:jdk
      - name: Verification du plugin natif
        run: pnpm --filter @kaissi/pos verifier:natif

  back-office:
    name: Back-office — types, tests et build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests du back-office
        run: pnpm --filter @kaissi/backoffice test
      # Le build echoue si un lien pointe vers une page inexistante (routes
      # typees) ou si une colonne du schema a ete renommee sans mettre a jour
      # src/serveur/schema.ts. Aucune variable d'environnement n'est requise :
      # toutes les pages sont rendues a la demande, jamais au build.
      - name: Build Next.js
        run: pnpm --filter @kaissi/backoffice build

  parcours-caisse:
    name: Parcours de caisse de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium
        run: pnpm --filter @kaissi/pos exec playwright install --with-deps chromium
      - name: Démarrer le POS et rejouer une journée de service
        run: |
          pnpm --filter @kaissi/pos exec vite --port 5173 --host 127.0.0.1 &
          npx wait-on -t 60000 http://127.0.0.1:5173/
          node apps/pos/tests/parcours-caisse.mjs

  synchronisation:
    name: Synchronisation — contre un vrai PostgreSQL
    runs-on: ubuntu-latest
    # Une base simulée validerait notre idée du SQL, pas le SQL. Or c'est là
    # que se cachent les erreurs de RLS, de contrainte et d'idempotence.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Appliquer le schéma de production tel quel
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1             -f apps/sync/test/amorce-supabase.sql
          for f in supabase/migrations/*.sql; do
            echo "→ $(basename "$f")"
            psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Tests d'intégration + banc à trois appareils
        run: pnpm --filter @kaissi/sync test

  # ── Linter ────────────────────────────────────────────────────────────────
  #
  # Les règles retenues correspondent chacune à une panne RÉELLE de ce dépôt :
  # la promesse abandonnée qui a fait croire que « Suspendre » était cassé, et
  # la propriété de paramètre que le « type stripping » de Node refuse — qui
  # aurait empêché le service de démarrer.
  #
  # Volontairement court : un linter qui signale trois cents choses ne signale
  # rien, on le désactive, et ce jour-là on perd aussi les règles utiles.
  lint:
    name: Linter — les règles qui ont déjà attrapé quelque chose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ── Dépendances et secrets ────────────────────────────────────────────────
  #
  # Deux contrôles que rien ne faisait, et qui trouvent des choses qu'aucune
  # relecture ne trouve.
  securite:
    name: Dépendances vulnérables et secrets échappés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique COMPLET : un secret commité puis retiré reste dans les
          # objets git, et c'est justement celui-là qu'on cherche. Un scan sur
          # le seul dernier commit ne verrait rien.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dépendances vulnérables
        run: |
          # Bloquant, et c'est le but : un avis NON examiné casse la
          # construction.
          #
          # Les avis déjà examinés vivent dans `pnpm.auditConfig.ignoreGhsas`
          # (package.json), avec la RAISON de leur mise à l'écart et la date
          # de revue. Ce n'est pas une liste d'exceptions, c'est la trace
          # d'une décision — et tout ce qui n'y figure pas passe au rouge.
          #
          # `--prod` a été essayé d'abord : dans un monorepo pnpm il ne filtre
          # PAS les dépendances de développement, et la CI aurait donc été
          # rouge dès le premier jour sur quatre alertes `postcss` non
          # exploitables. Une garde qui échoue sur du code correct finit
          # désactivée.
          pnpm audit --audit-level=high

      - name: Aucun secret dans l'historique
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  regles-absolues:
    name: Règles absolues (argent, UUID, server.url)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun server.url dans la configuration Capacitor
        run: |
          if grep -nE '^\s*(server\s*:|url\s*:)' apps/pos/capacitor.config.ts; then
            echo '::error::Un bloc server a ete introduit dans capacitor.config.ts. Le POS doit rester EMPAQUETE : charger une URL distante le rend inutilisable hors ligne. Voir CLAUDE.md.' 
            exit 1
          fi
          echo "OK — le POS reste empaqueté."

      - name: Aucune colonne monetaire sans suffixe _millimes
        run: |
          # Toute colonne dont le nom évoque un montant DOIT porter le suffixe.
          fautes=$(grep -rnE '^\s+[a-z_]*(price|amount|total|cost|subtotal|discount|tax|float|variance|counted|expected|duty)[a-z_]*\s+(bigint|integer|numeric)' \
            supabase/migrations/*.sql \
            | grep -v '_millimes' \
            | grep -v '_bp' \
            | grep -v 'cost_per_unit' \
            | grep -v 'numeric(18,6)' || true)
          if [ -n "$fautes" ]; then
            echo "::error::Colonne(s) monétaire(s) sans suffixe _millimes :"
            echo "$fautes"
            exit 1
          fi
          echo "OK — tous les montants sont suffixés _millimes."

      - name: Aucun type flottant pour de l'argent
        run: |
          if grep -rniE '\b(real|double precision|float[48]?)\b' supabase/migrations/*.sql; then
            echo "::error::Un type flottant a été introduit dans le schéma."
            echo "RÈGLE 1 : aucun flottant pour de l'argent, nulle part."
            exit 1
          fi
          echo "OK — aucun flottant dans le schéma."

      - name: Journaux order_events et audit_events en insertion seule
        run: |
          for table in order_events audit_events; do
            if ! grep -q "revoke update, delete, truncate on kaissi.$table" supabase/migrations/*.sql; then
              echo "::error::Le REVOKE sur kaissi.$table a disparu (RÈGLE 6)."
              exit 1
            fi
            if ! grep -q "${table}_immuable" supabase/migrations/*.sql; then
              echo "::error::Le déclencheur d'immuabilité de kaissi.$table a disparu."
              exit 1
            fi
          done
          echo "OK — les deux journaux restent append-only."

      - name: Index unique d'idempotence présent
        run: |
          if ! grep -q 'event_id        uuid        primary key' supabase/migrations/0005_sync.sql; then
            echo "::error::sync_mutations.event_id n'est plus clé primaire (RÈGLE 5)."
            echo "Sans cet index unique, le double encaissement redevient possible."
            exit 1
          fi
          echo "OK — l'idempotence est garantie."

      - name: La cle de service Supabase ne DESCEND pas vers le navigateur
        run: |
          # La regle n'est pas « nulle part » : elle est directionnelle.
          #
          # `service_role` contourne RLS. Elle vit LEGITIMEMENT dans le service
          # de synchronisation (apps/sync), qui porte deja la chaine PostgreSQL,
          # ne s'execute dans aucun navigateur, et que personne ne telecharge :
          # c'est lui qui cree les comptes Supabase. Elle ne doit JAMAIS entrer
          # dans ce qui est livre a un navigateur — le POS et le back-office.
          #
          # Interdire le mot partout, comme cette garde le faisait, cassait la
          # CI sur le code qui APPLIQUE la regle. Une garde qui echoue sur du
          # code correct finit desactivee, et ce jour-la elle ne protege plus
          # rien.
          fautes=$(grep -rnE 'sb_secret_|service_role_key|SUPABASE_SERVICE_ROLE' \
               --include='*.ts' --include='*.tsx' --include='*.mjs' \
               --include='*.json' apps/pos apps/backoffice packages 2>/dev/null \
             | grep -v 'apps/backoffice/src/serveur/supabase.ts' || true)
          if [ -n "$fautes" ]; then
            echo '::error::La cle de service Supabase a ete introduite dans du code livre a un navigateur :'
            echo "$fautes"
            echo 'Elle monte vers apps/sync, elle ne descend pas vers le client. Voir CLAUDE.md.'
            exit 1
          fi
          echo "OK — la cle de service reste dans le service."

      - name: Le back-office REFUSE la cle de service au demarrage
        run: |
          # Le pendant positif de la garde precedente : l'absence d'une mention
          # ne prouve rien si le controle qui la refuse a disparu.
          if ! grep -q 'sb_secret_' apps/backoffice/src/serveur/supabase.ts; then
            echo '::error::Le controle qui refuse la cle de service a disparu du back-office.'
            exit 1
          fi
          echo "OK — le back-office refuse encore la cle de service."

      - name: Aucun PIN en clair dans le code ou la graine
        run: |
          # Un PIN litteral AFFECTE a `pin_hash` ne l'est jamais ; un PIN passe
          # a `hacherPin()` l'est toujours — c'est meme la seule facon d'ecrire
          # un test lisible de la prise de poste.
          #
          # D'ou l'affectation DIRECTE dans le motif : `pin_hash: '2468'` est
          # refuse, `pin_hash: hacherPin('2468')` passe. Le motif large
          # d'avant refusait les deux, et le second est correct.
          fautes=$(grep -rnE "pin_hash['\"]?\s*[:=,]\s*['\"][0-9]{4,8}['\"]" \
            packages/ apps/ --include='*.ts' --include='*.tsx' || true)
          # Et en SQL : une graine qui poserait un PIN en clair dans la colonne.
          fautes_sql=$(grep -rnE "pin_hash[^)]*values[^)]*'[0-9]{4,8}'" \
            supabase/migrations/*.sql || true)
          if [ -n "$fautes$fautes_sql" ]; then
            echo "::error::PIN en clair détecté :"
            echo "$fautes"
            echo "$fautes_sql"
            exit 1
          fi
          echo "OK — aucun PIN en clair."
