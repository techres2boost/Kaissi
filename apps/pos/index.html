<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111417" />
    <!--
      Politique de sécurité du contenu.

      C'est la traduction technique de « l'application doit démarrer en mode
      avion » : tout ce qui s'exécute vient de l'APK ('self'), rien du réseau.

      • script-src 'self'  → aucun script distant, jamais. C'est ce qui
        interdit structurellement le pattern Stampi (coque + URL distante).
      • connect-src        → 'self' seulement. En Phase 2, l'URL de l'API de
        synchronisation sera ajoutée ICI, et elle seule ; localhost reste
        autorisé pour le développement.
      • font-src / img-src → pas de CDN, pas de Google Fonts : une police
        distante bloquerait le premier rendu hors ligne.

      `frame-ancestors` est volontairement absent : cette directive n'a aucun
      effet dans une balise <meta>, seul un en-tête HTTP la porte. L'y laisser
      ne protégeait de rien et polluait la console.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*"
    />
    <!-- Favicon en data-URI : embarquée, donc aucune requête au démarrage. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0a33f'/%3E%3Ctext x='16' y='23' font-family='system-ui' font-size='20' font-weight='800' text-anchor='middle' fill='%230f1214'%3EK%3C/text%3E%3C/svg%3E"
    />
    <title>Kaissi — Caisse</title>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
