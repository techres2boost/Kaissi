<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111417" />
    <!--
      Politique de sécurité du contenu.

      C'est la traduction technique de « l'application doit démarrer en mode
      avion » : tout ce qui s'exécute vient de l'APK ('self'), rien du réseau.

      • script-src 'self'  → aucun script distant, jamais. C'est ce qui
        interdit structurellement le pattern Stampi (coque + URL distante).
      • connect-src        → 'self' seulement. En Phase 2, l'URL de l'API de
        synchronisation sera ajoutée ICI, et elle seule ; localhost reste
        autorisé pour le développement.
      • font-src / img-src → pas de CDN, pas de Google Fonts : une police
        distante bloquerait le premier rendu hors ligne.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*"
    />
    <title>Kaissi — Caisse</title>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
