apply plugin: 'com.android.application'

/*
 * Version publiée — UNE seule source de vérité : `apps/pos/package.json`.
 *
 * Le Play Store refuse un envoi dont le `versionCode` n'est pas strictement
 * supérieur au précédent, et il ne se corrige pas : un numéro brûlé est brûlé.
 * Le laisser à « 1 » en dur garantissait de l'oublier, puis de perdre vingt
 * minutes à comprendre le refus.
 *
 * `1.4.2` devient donc `10402` : deux chiffres par segment, ordre naturel
 * préservé, et pas de collision jusqu'à 99 correctifs par mineure.
 */
def versionNpm = '0.0.0'
def codeVersion = 1
try {
    versionNpm = new groovy.json.JsonSlurper()
        .parse(rootProject.file('../package.json'))['version'] as String
    def segments = versionNpm.split('\\.')
    def majeure = segments[0].replaceAll(/\D/, '') as int
    def mineure = segments.length > 1 ? (segments[1].replaceAll(/\D/, '') as int) : 0
    // `2.3.1-rc4` → on ne garde que le « 1 » : une préversion et sa version
    // finale portent le même code, ce qui est le comportement voulu — on ne
    // publie pas les deux.
    def correctif = segments.length > 2 ? (segments[2].replaceAll(/\D.*/, '') as int) : 0
    codeVersion = majeure * 10000 + mineure * 100 + correctif
} catch (Exception e) {
    // Un build local ne doit JAMAIS échouer pour une histoire de numéro : on
    // retombe sur 1, et l'avertissement dit quoi regarder avant de publier.
    logger.warn("Version illisible dans apps/pos/package.json (${e.message}) — versionCode = 1.")
}

/*
 * ── Le numéro que la CI impose, quand elle publie ─────────────────────────
 *
 * `package.json` reste la source du numéro de VERSION affiché au client
 * (`versionName`). Mais le `versionCode`, lui, doit être strictement croissant
 * À CHAQUE ENVOI — et une publication automatique envoie plusieurs fois la
 * même version : deux corrections poussées le même jour portent toutes deux
 * « 0.1.3 », donc toutes deux le code 103, et Play refuse la seconde.
 *
 * La CI calcule donc le numéro suivant en INTERROGEANT Play, et le passe ici.
 * C'est la même mécanique que `get-latest-testflight-build-number` côté Apple :
 * on ne suppose pas le dernier numéro publié, on le demande à celui qui le
 * connaît.
 *
 * Absente — un build local, ou une CI sans identifiants Play — la variable
 * n'existe pas et l'on retombe sur `package.json`. Aucun poste de
 * développement ne dépend du réseau pour construire.
 */
def imposeParLaCI = System.getenv('KAISSI_VERSION_CODE')
if (imposeParLaCI?.isInteger()) {
    codeVersion = imposeParLaCI as int
    logger.lifecycle("versionCode imposé par la CI : ${codeVersion} (versionName ${versionNpm})")
}

/*
 * Signature de production.
 *
 * Les identifiants vivent dans `keystore.properties`, HORS du dépôt (voir
 * .gitignore). Sans ce fichier, seul le build de debug fonctionne — ce qui
 * est exactement ce qu'on veut : une CI ne doit pas pouvoir signer une
 * version de production.
 *
 * ⚠ Perdre le keystore = ne plus jamais pouvoir mettre à jour l'application
 *   déjà installée sur les tablettes des clients. Sauvegarde-le ailleurs.
 */
def fichierSignature = rootProject.file('keystore.properties')
def signatureDisponible = fichierSignature.exists()
def proprietesSignature = new Properties()
if (signatureDisponible) {
    proprietesSignature.load(new FileInputStream(fichierSignature))
}

android {
    signingConfigs {
        if (signatureDisponible) {
            release {
                storeFile file(proprietesSignature['storeFile'])
                storePassword proprietesSignature['storePassword']
                keyAlias proprietesSignature['keyAlias']
                keyPassword proprietesSignature['keyPassword']
            }
        }
    }
    namespace "tn.res2boost.kaissi"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "tn.res2boost.kaissi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codeVersion
        versionName versionNpm
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (signatureDisponible) {
                signingConfig signingConfigs.release
            }
            /*
             * `minifyEnabled false`, et c'est DÉLIBÉRÉ.
             *
             * Play avertit qu'aucun fichier de déobfuscation n'accompagne le
             * bundle. L'avertissement est exact et sans conséquence : il n'y
             * a rien à déobfusquer, puisque rien n'est obfusqué. Activer R8
             * réduirait la taille — et casserait silencieusement les plugins
             * Capacitor, qui se résolvent par RÉFLEXION : leurs classes n'ont
             * aucune référence statique, R8 les supprime, et la caisse
             * s'ouvre sur un écran blanc. Cela se règle avec des règles
             * `-keep`, une par plugin, et cela se VÉRIFIE sur un appareil.
             * Tant que ce n'est pas fait, un avertissement vaut mieux qu'une
             * caisse morte en service.
             */
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            /*
             * Les symboles natifs — demandés, mais SANS EFFET aujourd'hui, et
             * il faut le dire plutôt que de le croire réglé.
             *
             * Ce réglage demande à AGP d'empaqueter la version NON DÉPOUILLÉE
             * des bibliothèques natives. Encore faut-il qu'elle existe. Or le
             * seul code natif du bundle vient d'un AAR PRÉCOMPILÉ —
             * `net.zetetic:sqlcipher-android`, tiré par
             * `@capacitor-community/sqlite` — et ses quatre `.so` sont
             * publiées déjà dépouillées :
             *
             *     $ file jni/arm64-v8a/libsqlcipher.so
             *     … ARM aarch64, dynamically linked, stripped
             *     $ readelf -S …            → .dynsym seul, pas de .symtab
             *
             * AGP n'a donc rien à empaqueter, et Play continue d'avertir. Le
             * vérifié : l'avertissement est toujours là sur le versionCode 102,
             * ce réglage étant en place. Il ne se lèvera pas depuis ce dépôt.
             *
             * On garde la ligne : elle est inoffensive, et elle deviendra
             * vraie le jour où l'application aura du code natif à elle —
             * c'est alors qu'un plantage remonterait en adresses
             * hexadécimales faute de symboles. `SYMBOL_TABLE` nomme les
             * fonctions pour quelques centaines de kio ; `FULL` ajouterait
             * les numéros de ligne, pour plusieurs mégaoctets.
             */
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
