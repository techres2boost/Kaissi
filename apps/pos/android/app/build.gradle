apply plugin: 'com.android.application'

/*
 * Version publiée — UNE seule source de vérité : `apps/pos/package.json`.
 *
 * Le Play Store refuse un envoi dont le `versionCode` n'est pas strictement
 * supérieur au précédent, et il ne se corrige pas : un numéro brûlé est brûlé.
 * Le laisser à « 1 » en dur garantissait de l'oublier, puis de perdre vingt
 * minutes à comprendre le refus.
 *
 * `1.4.2` devient donc `10402` : deux chiffres par segment, ordre naturel
 * préservé, et pas de collision jusqu'à 99 correctifs par mineure.
 */
def versionNpm = '0.0.0'
def codeVersion = 1
try {
    versionNpm = new groovy.json.JsonSlurper()
        .parse(rootProject.file('../package.json'))['version'] as String
    def segments = versionNpm.split('\\.')
    def majeure = segments[0].replaceAll(/\D/, '') as int
    def mineure = segments.length > 1 ? (segments[1].replaceAll(/\D/, '') as int) : 0
    // `2.3.1-rc4` → on ne garde que le « 1 » : une préversion et sa version
    // finale portent le même code, ce qui est le comportement voulu — on ne
    // publie pas les deux.
    def correctif = segments.length > 2 ? (segments[2].replaceAll(/\D.*/, '') as int) : 0
    codeVersion = majeure * 10000 + mineure * 100 + correctif
} catch (Exception e) {
    // Un build local ne doit JAMAIS échouer pour une histoire de numéro : on
    // retombe sur 1, et l'avertissement dit quoi regarder avant de publier.
    logger.warn("Version illisible dans apps/pos/package.json (${e.message}) — versionCode = 1.")
}

/*
 * Signature de production.
 *
 * Les identifiants vivent dans `keystore.properties`, HORS du dépôt (voir
 * .gitignore). Sans ce fichier, seul le build de debug fonctionne — ce qui
 * est exactement ce qu'on veut : une CI ne doit pas pouvoir signer une
 * version de production.
 *
 * ⚠ Perdre le keystore = ne plus jamais pouvoir mettre à jour l'application
 *   déjà installée sur les tablettes des clients. Sauvegarde-le ailleurs.
 */
def fichierSignature = rootProject.file('keystore.properties')
def signatureDisponible = fichierSignature.exists()
def proprietesSignature = new Properties()
if (signatureDisponible) {
    proprietesSignature.load(new FileInputStream(fichierSignature))
}

android {
    signingConfigs {
        if (signatureDisponible) {
            release {
                storeFile file(proprietesSignature['storeFile'])
                storePassword proprietesSignature['storePassword']
                keyAlias proprietesSignature['keyAlias']
                keyPassword proprietesSignature['keyPassword']
            }
        }
    }
    namespace "tn.res2boost.kaissi"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "tn.res2boost.kaissi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codeVersion
        versionName versionNpm
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (signatureDisponible) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
